<!-- Outfit Suggestions & Realistic Silhouette Card -->
<div class="card outfit-card-wrapper">
  <div class="avatar-and-outfit-container">
    <!-- Realistic Model Preview Box -->
    <div class="avatar-box">
      <h4>Outfit Silhouette</h4>
      <div class="model-avatar-container" id="modelAvatarDisplay">
        <svg class="human-silhouette" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Head & Neck -->
          <circle cx="50" cy="22" r="12" fill="#d4a373" />
          <rect x="47" y="32" width="6" height="8" fill="#c68b59" />

          <!-- Optional Hat / Headgear Layer -->
          <path id="modelHat" d="M 35 18 Q 50 8 65 18 L 72 20 L 30 20 Z" fill="transparent" />

          <!-- Torso / Apparel Layer -->
          <path id="modelTorso" d="M 30 40 L 70 40 L 66 110 L 34 110 Z" fill="#e0683b" />

          <!-- Arms -->
          <rect x="20" y="42" width="8" height="55" rx="4" fill="#d4a373" />
          <rect x="72" y="42" width="8" height="55" rx="4" fill="#d4a373" />

          <!-- Legs / Pants Layer -->
          <path id="modelLegs" d="M 34 110 L 48 110 L 46 185 L 32 185 Z M 52 110 L 66 110 L 68 185 L 54 185 Z" fill="#2d3748" />

          <!-- Footwear Layer -->
          <g id="modelFootwear">
            <rect id="modelFootLeft" x="30" y="185" width="16" height="8" rx="2" fill="#1a202c" />
            <rect id="modelFootRight" x="54" y="185" width="16" height="8" rx="2" fill="#1a202c" />
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>
